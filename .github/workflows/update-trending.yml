name: Update trending gourmet
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-trending-gourmet
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch free news RSS
        run: python scripts/update_trending.py
      - name: Commit changed dataset
        run: |
          if ! git diff --quiet -- data/trending-gourmet.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trending-gourmet.json
            git commit -m "data: refresh trending gourmet articles"
            git push
          fi

