<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#26324A">
<title>ご当地グルメ検索 v7.3（カテゴリー別検索）</title>
<style>
:root {
  --bg:#F5EFE0; --card:#FFFCF4; --ink:#263652; --soft:#66728A;
  --red:#A33A3F; --green:#6E8B4E; --border:#D9CBA3; --head:#26324A;
}
*{box-sizing:border-box}
html,body{margin:0;background:#DED5BE;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
button,input,select{font:inherit}
.app{max-width:560px;min-height:100vh;margin:0 auto;background:var(--bg)}
.cover{background:var(--head);color:#F5EFE0;padding:24px 20px 22px}
.cover h1{margin:0;font-size:25px}
.cover p{margin:6px 0 0;font-size:12px;opacity:.72}
.search-panel{padding:18px 16px 12px}
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 14px;color:var(--ink);outline:none}
.primary{border:0;border-radius:12px;background:var(--red);color:white;padding:0 16px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px}
.row select,.ghost{flex:1;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:10px;color:var(--ink)}
.ghost{cursor:pointer}
.chips{display:flex;gap:7px;overflow:auto;padding:10px 16px 5px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--soft);padding:7px 11px;border-radius:999px;font-size:12px;cursor:pointer}
.chip.active{background:var(--ink);border-color:var(--ink);color:white}
.status{padding:8px 16px;font-size:12px;color:var(--soft)}
.category-options{margin:10px 16px 0;display:flex;gap:8px;align-items:center;font-size:12px}
.category-options select{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:10px;color:var(--ink)}
.search-hint{margin:8px 16px 0;font-size:11px;color:var(--soft);line-height:1.6}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 16px 12px}
.quick button,.quick a{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:11px;text-align:left;color:var(--ink);cursor:pointer}
.quick a{grid-column:1/-1;text-decoration:none}.quick b{display:block;font-size:13px} .quick span{display:block;font-size:11px;color:var(--soft);margin-top:3px}
.section-title{padding:14px 16px 7px;font-weight:800;font-size:14px}
.results{padding:0 16px 84px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;margin:9px 0}
.card-top{display:flex;gap:10px;align-items:flex-start}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:20px;flex:none}
.card-body{flex:1;min-width:0}
.title{font-weight:800;font-size:15px;margin:0}
.meta{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tag{border:1px solid var(--border);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--soft)}
.desc{font-size:12px;line-height:1.65;color:var(--soft);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions a,.actions button{text-decoration:none;border:1px solid var(--border);background:white;color:var(--ink);border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer}
.notice{border:1px dashed var(--border);background:rgba(255,255,255,.35);padding:13px;border-radius:12px;font-size:12px;line-height:1.7;color:var(--soft);margin:9px 0}
.bottom{position:sticky;bottom:0;background:var(--head);color:white;padding:10px 16px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.bottom small{opacity:.75}
.badge{font-size:11px;background:rgba(255,255,255,.14);padding:5px 8px;border-radius:999px}
.hidden{display:none!important}

.nearby-panel{margin:2px 16px 12px;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px}
.nearby-panel.hidden{display:none}
.nearby-title{font-weight:800;font-size:14px;margin-bottom:4px}
.nearby-note{font-size:11px;color:var(--soft);line-height:1.6;margin-bottom:9px}
.nearby-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.nearby-grid button{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:10px;padding:9px 8px;font-size:11.5px;font-weight:700;cursor:pointer;text-align:left}
.nearby-main{grid-column:1/-1;background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;text-align:center!important}
@media(min-width:600px){body{padding:20px} .app{border-radius:22px;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.2)}}
</style>
</head>
<body>
<div class="app">
<header class="cover">
  <h1>ご当地グルメ検索</h1>
  <p>有名店・観光地グルメ・道の駅・食全般をひとつの検索窓から｜検索するとGoogleマップの店舗一覧を表示</p>
</header>

<section class="search-panel">
  <div class="searchbox">
    <input id="q" autocomplete="off" aria-label="地域・店名・料理" placeholder="例：山形市 ラーメン / 高山 飛騨牛">
    <button class="primary" id="searchBtn">店舗を検索</button>
  </div>
  <div class="row">
    <select id="pref">
      <option value="">全国</option>
      <option>北海道</option><option>青森</option><option>岩手</option><option>宮城</option><option>秋田</option><option>山形</option><option>福島</option><option>茨城</option><option>栃木</option><option>群馬</option><option>埼玉</option><option>千葉</option><option>東京</option><option>神奈川</option><option>新潟</option><option>富山</option><option>石川</option><option>福井</option><option>山梨</option><option>長野</option><option>岐阜</option><option>静岡</option><option>愛知</option><option>三重</option><option>滋賀</option><option>京都</option><option>大阪</option><option>兵庫</option><option>奈良</option><option>和歌山</option><option>鳥取</option><option>島根</option><option>岡山</option><option>広島</option><option>山口</option><option>徳島</option><option>香川</option><option>愛媛</option><option>高知</option><option>福岡</option><option>佐賀</option><option>長崎</option><option>熊本</option><option>大分</option><option>宮崎</option><option>鹿児島</option><option>沖縄</option>
    </select>
    <button class="ghost" id="locBtn">📍 現在地を使う</button>
  </div>
</section>

<nav class="chips" id="chips">
  <button class="chip active" data-mode="all" aria-pressed="true">すべて</button>
  <button class="chip" data-mode="ramen" aria-pressed="false">🍜 ラーメン</button>
  <button class="chip" data-mode="famous" aria-pressed="false">有名店</button>
  <button class="chip" data-mode="tourist" aria-pressed="false">観光地グルメ</button>
  <button class="chip" data-mode="roadstation" aria-pressed="false">道の駅</button>
  <button class="chip" data-mode="sweets" aria-pressed="false">スイーツ</button>
  <button class="chip" data-mode="seafood" aria-pressed="false">海鮮</button>
  <button class="chip" data-mode="noodle" aria-pressed="false">麺</button>
  <button class="chip" data-mode="meat" aria-pressed="false">肉</button>
</nav>

<div class="category-options hidden" id="categoryOptions">
  <label for="kind">料理の種類</label>
  <select id="kind"></select>
</div>
<p class="search-hint">カテゴリーを選ぶときは、検索窓に市町村・駅名・店名を入力。料理の種類を選ぶとさらに絞り込めます。</p>
<div class="status" id="status">全国のグルメ情報を検索できます。</div>

<section class="nearby-panel hidden" id="nearbyPanel">
  <div class="nearby-title">📍 現在地周辺から探す</div>
  <div class="nearby-note">位置情報を使って、周辺のおすすめグルメをGoogleマップで検索します。</div>
  <div class="nearby-grid">
    <button class="nearby-main" data-nearby="all">🔥 周辺のおすすめグルメ</button>
    <button data-nearby="famous">⭐ 有名店</button>
    <button data-nearby="ramen">🍜 ラーメン</button>
    <button data-nearby="seafood">🐟 海鮮</button>
    <button data-nearby="meat" data-kind="焼肉店">🥩 焼肉</button>
    <button data-nearby="sweets">🍰 スイーツ</button>
    <button data-nearby="roadstation">🛣️ 道の駅</button>
  </div>
</section>

<section class="quick">
  <a href="./gifu-chahan/"><b>🍚 全国チャーハン帖</b><span>47都道府県・食べ歩き記録</span></a>
  <button data-quick="famous"><b>🔥 人気グルメ</b><span>地域＋人気店で探す</span></button>
  <button data-quick="tourist"><b>🚶 食べ歩き</b><span>観光地周辺を探す</span></button>
  <button data-quick="roadstation"><b>🛣️ 道の駅グルメ</b><span>食事・軽食・土産</span></button>
  <button data-quick="sweets"><b>🍰 スイーツ</b><span>和菓子・洋菓子</span></button>
</section>

<div class="section-title" id="resultTitle">検索リンク</div>
<main class="results" id="results"></main>

<footer class="bottom">
  <small>最後の検索語をこの端末に保存（保存可能な場合）</small>
</footer>
</div>

<script>
function readLastQuery() {
  try { return localStorage.getItem('gourmet-last-query-v2') || ''; }
  catch { return ''; }
}
function saveLastQuery(query) {
  try { localStorage.setItem('gourmet-last-query-v2', query); }
  catch { /* 保存できない環境でも検索は継続する */ }
}

const STATE = {
  mode:'all',
  kind:'',
  query:'',
  pref:'',
  coords:null
};

// Each search uses one business type; alternatives belong in the selector.
const MODES = {
  all:{label:'すべて', term:''},
  ramen:{label:'ラーメン', term:'ラーメン店'},
  famous:{label:'有名店', term:'人気の飲食店'},
  tourist:{label:'観光地グルメ', term:'観光地 飲食店'},
  roadstation:{label:'道の駅', term:'道の駅'},
  sweets:{label:'スイーツ', term:'スイーツ店', kinds:[
    ['スイーツ全般','スイーツ店'], ['和菓子','和菓子店'], ['洋菓子','洋菓子店'],
    ['ケーキ','ケーキ店'], ['パフェ','パフェ専門店']
  ]},
  seafood:{label:'海鮮', term:'海鮮料理店', kinds:[
    ['海鮮料理全般','海鮮料理店'], ['海鮮丼','海鮮丼専門店'], ['寿司','寿司店']
  ]},
  noodle:{label:'麺', term:'麺料理店', kinds:[
    ['麺料理全般','麺料理店'], ['ラーメン','ラーメン店'], ['うどん','うどん店'],
    ['そば','そば店'], ['つけ麺','つけ麺店'], ['パスタ','パスタ専門店']
  ]},
  meat:{label:'肉', term:'肉料理店', kinds:[
    ['肉料理全般','肉料理店'], ['焼肉','焼肉店'], ['ステーキ','ステーキ店'],
    ['焼鳥','焼鳥店'], ['とんかつ','とんかつ店'], ['ハンバーグ','ハンバーグ専門店']
  ]}
};
const FOOD_MODES = new Set(['ramen','sweets','seafood','noodle','meat']);
// Only whole keywords are replaced. Names such as「九州ラーメンうまか」remain intact.
const FOOD_TERMS = {
  ラーメン:'ラーメン店', 拉麺:'ラーメン店', らーめん:'ラーメン店',
  中華そば:'ラーメン店', うどん:'うどん店', そば:'そば店', 蕎麦:'そば店',
  つけ麺:'つけ麺店', パスタ:'パスタ専門店', 麺:'麺料理店',
  肉:'肉料理店', 肉料理:'肉料理店', 焼肉:'焼肉店', ステーキ:'ステーキ店',
  焼鳥:'焼鳥店', 焼き鳥:'焼鳥店', とんかつ:'とんかつ店',
  ハンバーグ:'ハンバーグ専門店', スイーツ:'スイーツ店',
  和菓子:'和菓子店', 洋菓子:'洋菓子店', ケーキ:'ケーキ店', パフェ:'パフェ専門店',
  海鮮:'海鮮料理店', 海鮮料理:'海鮮料理店', 海鮮丼:'海鮮丼専門店', 寿司:'寿司店', すし:'寿司店'
};
const FOOD_WORDS = new Set([
  ...Object.keys(FOOD_TERMS), ...Object.values(FOOD_TERMS),
  'カフェ','喫茶店','カレー','チャーハン','炒飯','餃子','ピザ','飛騨牛','牛丼','焼きそば','定食'
]);
const GENERAL_WORDS = new Set([
  '人気','人気店','人気グルメ','おすすめ','おすすめグルメ','有名店',
  'グルメ','飲食店','レストラン','観光地グルメ','食べ歩き','名物'
]);

function normalizeQuery(query='') {
  return query.normalize('NFKC').replace(/[・、,]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function queryWords(query) {
  return normalizeQuery(query).split(' ').filter(Boolean);
}
function categoryTerm() {
  return STATE.kind || MODES[STATE.mode].term;
}
function searchText() {
  let words = queryWords(STATE.query);
  if(STATE.mode !== 'all') {
    words = words.filter(word => !GENERAL_WORDS.has(word) &&
      !(FOOD_MODES.has(STATE.mode) && FOOD_WORDS.has(word)));
  }
  const pref = fullPrefName(STATE.pref);
  words = words.filter(word => !pref || (word !== STATE.pref && word !== pref));
  const term = categoryTerm();
  // Avoid appending another generic restaurant type to an explicit dish search.
  const type = STATE.mode === 'all' && !words.length ? '飲食店' :
    STATE.mode === 'famous' && words.some(word => FOOD_WORDS.has(word)) ? '人気店' : term;
  return [...new Set([pref, ...words, type].filter(Boolean))].join(' ') || '飲食店';
}
function fullPrefName(pref) {
  if(!pref || pref === '北海道') return pref;
  if(pref === '京都' || pref === '大阪') return pref + '府';
  if(pref === '東京') return '東京都';
  return /[都府県]$/.test(pref) ? pref : pref + '県';
}
function setMode(mode, inferKind=true) {
  STATE.mode = Object.hasOwn(MODES, mode) ? mode : 'all';
  const config = MODES[STATE.mode];
  STATE.kind = config.kinds ? config.term : '';
  if(inferKind && config.kinds) {
    const terms = new Set(queryWords(document.getElementById('q').value)
      .map(word => Object.hasOwn(FOOD_TERMS, word) ? FOOD_TERMS[word] : word)
      .filter(term => config.kinds.some(([, value]) => value === term)));
    if(terms.size === 1) STATE.kind = [...terms][0];
  }
  const options = document.getElementById('categoryOptions');
  options.classList.toggle('hidden', !config.kinds);
  const select = document.getElementById('kind');
  select.innerHTML = (config.kinds || []).map(([label, value]) =>
    `<option value="${value}">${label}</option>`).join('');
  select.value = STATE.kind;
  document.querySelectorAll('.chip').forEach(chip => {
    const active = chip.dataset.mode === STATE.mode;
    chip.classList.toggle('active', active);
    chip.setAttribute('aria-pressed', String(active));
  });
}

function esc(s='') {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function clearLocation() {
  STATE.coords = null;
  document.getElementById('locBtn').textContent = '📍 現在地を使う';
  document.getElementById('nearbyPanel').classList.add('hidden');
}
function mapsSearchUrl() {
  return nearbyMapsUrl(searchText());
}
function nearbyMapsUrl(term='飲食店') {
  const q = encodeURIComponent(term);
  if(!STATE.coords) return 'https://www.google.com/maps/search/?api=1&query=' + q;
  const {lat,lng} = STATE.coords;
  return `https://www.google.com/maps/search/${q}/@${lat},${lng},14z`;
}
function openNearby(mode, kind) {
  if(!STATE.coords) {
    alert('先に「現在地を使う」を押してください。');
    return;
  }
  document.getElementById('q').value = '';
  setMode(mode, false);
  if(MODES[STATE.mode].kinds?.some(([, value]) => value === kind)) {
    STATE.kind = kind;
    document.getElementById('kind').value = kind;
  }
  doSearch();
  window.open(mapsSearchUrl(), '_blank', 'noopener');
}
function webSearchUrl() {
  const location = STATE.coords ? ` ${STATE.coords.lat},${STATE.coords.lng} 周辺` : '';
  return 'https://www.google.com/search?q=' + encodeURIComponent(searchText() + location);
}

function render() {
  const box = document.getElementById('results');
  const condition = (STATE.coords ? '現在地周辺・' : '') + searchText();

  box.innerHTML = `<div class="notice">
    <b>${esc(condition)}を検索</b><br>
    「店舗を検索」または下のボタンを押すと、Googleマップの店舗一覧を開きます。戻る操作でこの画面に戻れます。
    <div class="actions">
      <a target="_blank" rel="noopener" href="${mapsSearchUrl()}">Googleマップで店舗検索</a>
      <a target="_blank" rel="noopener" href="${webSearchUrl()}">Webで店舗情報を検索</a>
    </div>
    <small>表示される検索語を確認できます。Googleマップでは関連候補が表示される場合があります。</small>
  </div>`;

  const label = STATE.pref ? STATE.pref + '・' : '';
  document.getElementById('resultTitle').textContent = label + (STATE.query ? `「${STATE.query}」の検索リンク` : '検索リンク');
  document.getElementById('status').textContent =
    `オンライン店舗検索 ／ カテゴリー：${MODES[STATE.mode].label}` + (STATE.coords ? ' ／ 📍現在地周辺検索ON' : '');
}

function doSearch() {
  STATE.query = normalizeQuery(document.getElementById('q').value);
  STATE.pref = document.getElementById('pref').value;
  if(STATE.pref && STATE.coords) clearLocation();
  saveLastQuery(STATE.query);
  render();
}

function searchStores() {
  doSearch();
  window.location.href = mapsSearchUrl();
}

document.getElementById('searchBtn').addEventListener('click', searchStores);
document.getElementById('q').addEventListener('input', doSearch);
document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); searchStores(); } });
document.getElementById('pref').addEventListener('change', () => {
  clearLocation();
  doSearch();
});

document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
  setMode(btn.dataset.mode);
  doSearch();
}));
document.getElementById('kind').addEventListener('change', event => {
  STATE.kind = event.target.value;
  doSearch();
});

document.querySelectorAll('[data-quick]').forEach(btn => btn.addEventListener('click', () => {
  setMode(btn.dataset.quick);
  searchStores();
}));

document.getElementById('locBtn').addEventListener('click', () => {
  if(STATE.coords) {
    clearLocation();
    doSearch();
    return;
  }
  if(!navigator.geolocation) {
    alert('この端末は位置情報に対応していません。'); return;
  }
  const mapWindow = window.open('about:blank', '_blank');
  const btn = document.getElementById('locBtn');
  btn.textContent = '位置情報を取得中…';
  btn.disabled = true;
  document.getElementById('pref').disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    STATE.coords = {lat:pos.coords.latitude,lng:pos.coords.longitude};
    btn.disabled = false;
    document.getElementById('pref').disabled = false;
    btn.textContent = '📍 現在地検索を解除';
    document.getElementById('nearbyPanel').classList.remove('hidden');
    STATE.query = '';
    document.getElementById('q').value = STATE.query;
    STATE.pref = '';
    document.getElementById('pref').value = '';
    saveLastQuery(STATE.query);
    render();
    const url = mapsSearchUrl();
    if(mapWindow) {
      try { mapWindow.opener = null; } catch(e) {}
      mapWindow.location.href = url;
    } else {
      window.location.href = url;
    }
  }, err => {
    btn.disabled = false;
    document.getElementById('pref').disabled = false;
    btn.textContent = '📍 現在地を使う';
    if(mapWindow) mapWindow.close();
    alert('位置情報を取得できませんでした。ブラウザの位置情報許可を確認してください。');
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
});

document.querySelectorAll('[data-nearby]').forEach(btn => btn.addEventListener('click', () => {
  openNearby(btn.dataset.nearby, btn.dataset.kind);
}));

document.getElementById('q').value = readLastQuery();
STATE.query = document.getElementById('q').value;
render();
</script>
</body>
</html>
