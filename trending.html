<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#26324a"><title>話題のグルメ｜ご当地グルメ検索</title>
<style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#263652;background:#ded5be}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;min-height:100vh;background:#f5efe0}.head{background:#26324a;color:white;padding:22px 18px}.head a{color:white}.wrap{padding:16px}h1{font-size:24px;margin:7px 0}p{line-height:1.65}.small{font-size:12px;color:#66728a}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;margin-bottom:5px}select,input{width:100%;border:1px solid #d9cba3;background:white;padding:10px;border-radius:9px;font-size:15px}.full{grid-column:1/-1}.card{background:#fffcf4;border:1px solid #d9cba3;border-radius:13px;padding:15px;margin:12px 0}.card h2{font-size:16px;line-height:1.45;margin:0 0 8px}.card a{color:#244875}.meta{color:#56657a;font-size:12px}.pill{display:inline-block;border-radius:20px;border:1px solid #d9cba3;padding:3px 7px;margin:5px 5px 5px 0;font-size:11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.notice{background:#fff8e9;border:1px dashed #d9cba3;border-radius:10px;padding:12px;margin:12px 0;font-size:13px}a:focus,select:focus,input:focus{outline:2px solid #a33a3f} @media(max-width:440px){.controls{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="head"><a href="./">← ご当地グルメ検索へ戻る</a><h1>🔥 SNS・ネット話題グルメ</h1><div>無料の公開記事から話題の飲食店・スイーツを探す</div></header>
<div class="wrap"><div class="notice">SNSの投稿数・再生数を直接取得したランキングではありません。記事の見出しをもとに抽出した候補です。店名や営業情報は必ず情報元・地図で確認してください。</div>
<div class="controls"><div><label for="pref">都道府県</label><select id="pref"><option value="">全国</option></select></div><div><label for="city">市区町村</label><select id="city" disabled><option value="">市区町村すべて</option></select></div><div><label for="genre">ジャンル</label><select id="genre"><option value="">すべて</option><option value="sweets">スイーツ</option><option value="food">飲食店・料理</option></select></div><div><label for="days">掲載期間</label><select id="days"><option value="7">7日間</option><option value="30" selected>30日間</option></select></div><div class="full"><label for="search">記事キーワード</label><input id="search" placeholder="店名・メニュー名など"></div></div>
<p class="small" id="updated"></p><div id="results" aria-live="polite">記事を読み込んでいます…</div></div></main>
